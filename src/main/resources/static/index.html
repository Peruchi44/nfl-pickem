<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Pick'Em</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nfl: {
                            blue: '#013369',
                            red: '#D50A0A'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-12">

<!-- Header -->
<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-football text-amber-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wider text-white">NFL PICK'EM</h1>
        </div>

        <div class="flex items-center space-x-4">
            <div id="userGreeting" class="hidden text-sm text-slate-300">
                Olá, <span id="userNameDisplay" class="font-bold text-amber-400"></span>
            </div>
            <button id="authBtn" onclick="handleAuthClick()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-medium transition">
                Entrar
            </button>
        </div>
    </div>
</header>

<!-- Conteúdo Principal -->
<main class="max-w-6xl mx-auto px-4 mt-6">
    <!-- Controles: Seleção de Rodada e Leaderboard -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
        <div class="flex items-center space-x-3 w-full md:w-auto">
            <label for="weekSelect" class="text-sm font-medium text-slate-400">Semana:</label>
            <select id="weekSelect" onchange="changeWeek()" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500 flex-1 md:w-48">
            </select>
        </div>

        <div class="flex gap-2 w-full md:w-auto">
            <button onclick="openLeaderboardModal()" class="w-full md:w-auto bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-trophy"></i> Ver Leaderboard
            </button>
        </div>
    </div>

    <!-- Banner de Notificação -->
    <div id="notificationBanner" class="hidden mb-6 p-4 rounded-lg text-sm flex items-center justify-between">
        <span id="notificationMessage"></span>
        <button onclick="hideNotification()" class="text-slate-400 hover:text-white">&times;</button>
    </div>

    <!-- Grid de Jogos -->
    <div id="gamesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    </div>

    <!-- Bloco do Tiebreaker (Margem de Vitória) -->
    <div id="tiebreakerCard" class="hidden mt-8 bg-gradient-to-r from-amber-950/30 via-slate-900 to-amber-950/30 border border-amber-500/40 rounded-xl p-5 shadow-lg">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-star text-amber-400 text-xl"></i>
                <div>
                    <h3 class="text-base font-bold text-amber-300">Jogo do Desempate (Tiebreaker)</h3>
                    <p id="tiebreakerGameDescription" class="text-xs text-slate-400">Digite a margem final de vitória prevista para o último jogo.</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <input type="number" id="tiebreakerMarginInput" min="1" max="99" placeholder="Margem pts (ex: 7)" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 w-44 text-center focus:ring-amber-500 focus:border-amber-500">
                <button onclick="saveTiebreakerMargin()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition">
                    Salvar Margem
                </button>
            </div>
        </div>
    </div>
</main>

<!-- Modal Login -->
<div id="loginModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl w-full max-w-md">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-white">Identifique-se</h3>
            <button onclick="closeLoginModal()" class="text-slate-400 hover:text-white">&times;</button>
        </div>
        <p class="text-xs text-slate-400 mb-4">Digite seu e-mail e nome para salvar seus palpites e ver sua pontuação.</p>
        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">E-mail</label>
                <input type="email" id="loginEmail" required class="w-full bg-slate-800 border border-slate-700 text-white rounded p-2.5 text-sm focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Nome / Apelido</label>
                <input type="text" id="loginName" required class="w-full bg-slate-800 border border-slate-700 text-white rounded p-2.5 text-sm focus:ring-amber-500 focus:border-amber-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                Acessar
            </button>
        </form>
    </div>
</div>

<!-- Modal Leaderboard -->
<div id="leaderboardModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl w-full max-w-2xl max-h-[85vh] flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-400 text-lg"></i>
                <h3 class="text-lg font-bold text-white">Classificação Geral</h3>
            </div>
            <button onclick="closeLeaderboardModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>

        <div class="overflow-y-auto flex-1">
            <table class="w-full text-sm text-left text-slate-300">
                <thead class="text-xs uppercase bg-slate-800 text-slate-400 sticky top-0">
                <tr>
                    <th class="px-4 py-3 rounded-l-lg">Pos</th>
                    <th class="px-4 py-3">Participante</th>
                    <th class="px-4 py-3 text-center">Acertos</th>
                    <th class="px-4 py-3 text-center rounded-r-lg">Dif. Tiebreaker</th>
                </tr>
                </thead>
                <tbody id="leaderboardBody" class="divide-y divide-slate-800/60">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Lógica JavaScript -->
<script>
    const CURRENT_SEASON = 2026;
    let currentUser = JSON.parse(localStorage.getItem('nfl_user') || 'null');
    let currentWeek = 2;
    let activeWeekData = null;
    let currentStatsMap = {};
    let userPicks = {};

    document.addEventListener('DOMContentLoaded', () => {
        initWeekSelector();
        checkUserAuth();
        loadWeek(CURRENT_SEASON, currentWeek);
    });

    function initWeekSelector() {
        const select = document.getElementById('weekSelect');
        select.innerHTML = '';
        for (let i = 1; i <= 18; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = 'Semana ' + i;
            select.appendChild(opt);
        }
        select.value = currentWeek;
    }

    function checkUserAuth() {
        const greeting = document.getElementById('userGreeting');
        const nameDisplay = document.getElementById('userNameDisplay');
        const authBtn = document.getElementById('authBtn');

        if (currentUser && (currentUser.id || currentUser.userId || currentUser._id)) {
            greeting.classList.remove('hidden');
            nameDisplay.textContent = currentUser.displayName || currentUser.username || currentUser.name || currentUser.email;
            authBtn.textContent = 'Sair';
            authBtn.className = 'bg-slate-800 hover:bg-slate-700 text-white text-sm px-4 py-2 rounded font-medium transition';
        } else {
            greeting.classList.add('hidden');
            authBtn.textContent = 'Entrar';
            authBtn.className = 'bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-medium transition';
        }
    }

    function handleAuthClick() {
        if (currentUser) {
            localStorage.removeItem('nfl_user');
            currentUser = null;
            userPicks = {};
            checkUserAuth();
            loadWeek(CURRENT_SEASON, currentWeek);
        } else {
            openLoginModal();
        }
    }

    function openLoginModal() {
        document.getElementById('loginModal').classList.remove('hidden');
    }

    function closeLoginModal() {
        document.getElementById('loginModal').classList.add('hidden');
    }

    async function handleLoginSubmit(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        const email = document.getElementById('loginEmail').value.trim();
        const name = document.getElementById('loginName').value.trim();

        if (!email) {
            alert('Informe um e-mail.');
            return;
        }

        try {
            let res = await fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, name: name })
            });

            if (res.status === 404) {
                res = await fetch('/api/users/login-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, name: name })
                });
            }

            if (res.ok) {
                currentUser = await res.json();
                localStorage.setItem('nfl_user', JSON.stringify(currentUser));
                closeLoginModal();
                checkUserAuth();
                loadWeek(CURRENT_SEASON, currentWeek);
                showNotification('Conectado com sucesso!', 'success');
            } else {
                const errDetail = await res.text();
                alert('Erro ao autenticar: ' + errDetail);
            }
        } catch (err) {
            console.error('Falha na autenticação:', err);
            alert('Erro de conexão ao autenticar.');
        }
    }

    function changeWeek() {
        currentWeek = parseInt(document.getElementById('weekSelect').value);
        loadWeek(CURRENT_SEASON, currentWeek);
    }

    function renderTeamStatsBlock(teamName, statsMap) {
        const stats = statsMap ? statsMap[teamName] : null;

        if (!stats || stats.gamesPlayed === 0) {
            return '<div class="text-[11px] text-slate-500 mt-2 italic text-center w-full">Sem jogos anteriores</div>';
        }

        const record = stats.wins + '-' + stats.losses + (stats.ties > 0 ? '-' + stats.ties : '');
        const recent = (stats.recentResults && stats.recentResults.length > 0)
            ? stats.recentResults.slice(-2).join(' | ')
            : '';

        const pf = Number(stats.pointsForPerGame) || 0;
        const pa = Number(stats.pointsAgainstPerGame) || 0;

        const maxRef = 40;
        const pfPercent = Math.min(100, Math.max(8, Math.round((pf / maxRef) * 100)));
        const paPercent = Math.min(100, Math.max(8, Math.round((pa / maxRef) * 100)));

        return `
                <div class="mt-2.5 pt-2 border-t border-slate-800 text-left w-full space-y-1.5">
                    <div class="flex items-center justify-between text-[11px] text-slate-400">
                        <span class="font-bold text-amber-400">${record}</span>
                        <span class="text-[10px] text-slate-500 font-mono">${stats.gamesPlayed}J</span>
                    </div>

                    <!-- Gráfico: Pontos Pró (Ataque) -->
                    <div class="space-y-0.5">
                        <div class="flex justify-between text-[10px]">
                            <span class="text-slate-400">Ataque</span>
                            <span class="font-semibold text-emerald-400 font-mono">${pf.toFixed(1)}</span>
                        </div>
                        <div class="w-full bg-slate-950/80 h-1.5 rounded-full overflow-hidden border border-slate-800">
                            <div style="width: ${pfPercent}%" class="bg-emerald-500 h-full rounded-full transition-all duration-500"></div>
                        </div>
                    </div>

                    <!-- Gráfico: Pontos Contra (Defesa) -->
                    <div class="space-y-0.5">
                        <div class="flex justify-between text-[10px]">
                            <span class="text-slate-400">Defesa</span>
                            <span class="font-semibold text-rose-400 font-mono">${pa.toFixed(1)}</span>
                        </div>
                        <div class="w-full bg-slate-950/80 h-1.5 rounded-full overflow-hidden border border-slate-800">
                            <div style="width: ${paPercent}%" class="bg-rose-500 h-full rounded-full transition-all duration-500"></div>
                        </div>
                    </div>

                    ${recent ? `<div class="text-[9px] text-slate-500 truncate pt-0.5" title="${stats.recentResults.join('\n')}">Últimos: ${recent}</div>` : ''}
                </div>
            `;
    }

    function renderWinProbabilityBar(awayTeam, homeTeam, statsMap) {
        const awayStats = statsMap ? statsMap[awayTeam] : null;
        const homeStats = statsMap ? statsMap[homeTeam] : null;

        if (!awayStats || !homeStats || (awayStats.gamesPlayed === 0 && homeStats.gamesPlayed === 0)) {
            return `
                    <div class="mt-3 pt-3 border-t border-slate-800/80">
                        <div class="flex justify-between items-center text-[10px] font-semibold text-slate-400 mb-1">
                            <span>${awayTeam} 50%</span>
                            <span class="text-[9px] uppercase tracking-wider text-slate-500">Prob. Vitória</span>
                            <span>50% ${homeTeam}</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden flex">
                            <div style="width: 50%" class="bg-blue-600"></div>
                            <div style="width: 50%" class="bg-amber-500"></div>
                        </div>
                    </div>
                `;
        }

        const calcPower = (stats) => {
            if (!stats || stats.gamesPlayed === 0) return 0.5;
            const pf = Math.max(stats.pointsForPerGame || 15, 1);
            const pa = Math.max(stats.pointsAgainstPerGame || 15, 1);
            return Math.pow(pf, 2.37) / (Math.pow(pf, 2.37) + Math.pow(pa, 2.37));
        };

        let awayPower = calcPower(awayStats);
        let homePower = calcPower(homeStats) * 1.08;

        let total = awayPower + homePower;
        let awayProb = Math.round((awayPower / total) * 100);
        let homeProb = 100 - awayProb;

        awayProb = Math.max(12, Math.min(88, awayProb));
        homeProb = 100 - awayProb;

        return `
                <div class="mt-3 pt-3 border-t border-slate-800/80">
                    <div class="flex justify-between items-center text-[10px] font-semibold text-slate-400 mb-1">
                        <span class="${awayProb >= 50 ? 'text-blue-400 font-bold' : ''}">${awayTeam} ${awayProb}%</span>
                        <span class="text-[9px] uppercase tracking-wider text-slate-500 flex items-center gap-1">
                            <i class="fa-solid fa-chart-pie text-[9px]"></i> Prob. Vitória
                        </span>
                        <span class="${homeProb >= 50 ? 'text-amber-400 font-bold' : ''}">${homeProb}% ${homeTeam}</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden flex shadow-inner">
                        <div style="width: ${awayProb}%" class="bg-blue-600 transition-all duration-500" title="${awayTeam}: ${awayProb}%"></div>
                        <div style="width: ${homeProb}%" class="bg-amber-500 transition-all duration-500" title="${homeTeam}: ${homeProb}%"></div>
                    </div>
                </div>
            `;
    }

    async function loadWeek(season, weekNumber) {
        const grid = document.getElementById('gamesGrid');
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Carregando rodada...</div>';

        try {
            const res = await fetch('/api/weeks/' + season + '/' + weekNumber);
            if (!res.ok) {
                grid.innerHTML = '<div class="col-span-full py-12 text-center text-amber-400">Nenhum dado cadastrado para a Semana ' + weekNumber + ' (' + season + ').</div>';
                document.getElementById('tiebreakerCard').classList.add('hidden');
                return;
            }
            activeWeekData = await res.json();

            currentStatsMap = {};
            try {
                const statsRes = await fetch('/api/stats/' + season + '/before-week/' + weekNumber);
                if (statsRes.ok) currentStatsMap = await statsRes.json();
            } catch (e) {
                console.warn('Estatísticas prévias não disponíveis:', e);
            }

            userPicks = {};
            let userTiebreakerMargin = null;
            const userId = currentUser ? (currentUser.id || currentUser.userId || currentUser._id) : null;

            if (userId) {
                try {
                    const picksRes = await fetch('/api/picks/' + userId + '/' + season + '/' + weekNumber);
                    if (picksRes.ok) {
                        const userPickData = await picksRes.json();
                        if (userPickData && userPickData.picks) {
                            userPicks = userPickData.picks;
                        }
                        if (userPickData && userPickData.tiebreakerMargin != null) {
                            userTiebreakerMargin = userPickData.tiebreakerMargin;
                        }
                    }
                } catch (e) {
                    console.warn('Palpites do usuário ainda não encontrados:', e);
                }
            }

            renderGames(activeWeekData.games || [], currentStatsMap, activeWeekData.tiebreakerGameId);
            renderTiebreakerCard(activeWeekData, userTiebreakerMargin);

        } catch (err) {
            console.error('Erro ao processar rodada:', err);
            grid.innerHTML = '<div class="col-span-full py-12 text-center text-red-400">Falha ao carregar confrontos da semana.</div>';
            document.getElementById('tiebreakerCard').classList.add('hidden');
        }
    }

    function renderGames(games, statsMap, tiebreakerGameId) {
        const grid = document.getElementById('gamesGrid');
        grid.innerHTML = '';

        if (!games || games.length === 0) {
            grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500">Nenhum jogo cadastrado nesta semana.</div>';
            return;
        }

        const now = new Date();

        games.forEach(game => {
            const kickOffDate = game.kickOff ? new Date(game.kickOff) : null;
            const isFinal = game.status === 'STATUS_FINAL' || game.status === 'FINAL';
            const isInProgress = game.status === 'STATUS_IN_PROGRESS' || game.status === 'IN_PROGRESS';

            const isLocked = isFinal || isInProgress || (kickOffDate && now >= kickOffDate);
            const isTiebreaker = (game.id === tiebreakerGameId);

            const rawPicked = userPicks[game.id];
            const picked = rawPicked ? String(rawPicked).trim().toUpperCase() : null;
            const awayCode = (game.awayTeam || 'NFL').toString().trim().toUpperCase();
            const homeCode = (game.homeTeam || 'NFL').toString().trim().toUpperCase();

            const isAwaySelected = (picked === awayCode);
            const isHomeSelected = (picked === homeCode);

            const card = document.createElement('div');
            card.className = 'bg-slate-900 border ' + (isTiebreaker ? 'border-amber-500/50 shadow-amber-500/10 shadow-lg' : 'border-slate-800') + ' rounded-xl p-4 flex flex-col justify-between relative overflow-hidden';

            let tiebreakerBadge = '';
            if (isTiebreaker) {
                tiebreakerBadge = '<div class="absolute top-0 right-0 bg-amber-500 text-slate-950 font-bold text-[10px] uppercase px-2 py-0.5 rounded-bl">' +
                    '<i class="fa-solid fa-star mr-1"></i> Desempate' +
                    '</div>';
            }

            let statusColor = 'text-blue-400';
            let statusLabel = game.status || 'SCHEDULED';

            if (isFinal) {
                statusColor = 'text-emerald-400';
            } else if (isInProgress) {
                statusColor = 'text-amber-400 animate-pulse';
            } else if (isLocked) {
                statusColor = 'text-rose-400';
                statusLabel = 'BLOQUEADO';
            }

            const dateStr = kickOffDate ? kickOffDate.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : 'A definir';
            const awayLogo = game.awayLogo || ('https://a.espncdn.com/i/teamlogos/nfl/500/' + awayCode.toLowerCase() + '.png');
            const homeLogo = game.homeLogo || ('https://a.espncdn.com/i/teamlogos/nfl/500/' + homeCode.toLowerCase() + '.png');

            const baseButtonClasses = 'p-3 rounded-lg border text-center transition flex flex-col justify-between items-center w-full ';
            const awayStyle = isAwaySelected
                ? 'bg-amber-500/20 border-2 border-amber-400 text-amber-300 shadow-md shadow-amber-500/20 ring-1 ring-amber-400'
                : 'bg-slate-800/60 border-slate-700/60 text-slate-200 hover:bg-slate-800';

            const homeStyle = isHomeSelected
                ? 'bg-amber-500/20 border-2 border-amber-400 text-amber-300 shadow-md shadow-amber-500/20 ring-1 ring-amber-400'
                : 'bg-slate-800/60 border-slate-700/60 text-slate-200 hover:bg-slate-800';

            const cursorStyle = isLocked ? 'cursor-not-allowed opacity-80' : 'cursor-pointer';

            card.innerHTML = tiebreakerBadge +
                '<div class="flex justify-between items-center text-xs text-slate-400 mb-3">' +
                '<span><i class="fa-regular fa-clock mr-1"></i> ' + dateStr + (isLocked && !isFinal && !isInProgress ? ' <i class="fa-solid fa-lock text-rose-400 ml-1"></i>' : '') + '</span>' +
                '<span class="font-semibold ' + statusColor + '">' + statusLabel + '</span>' +
                '</div>' +
                '<div class="grid grid-cols-2 gap-3 mb-2">' +
                // Visitante
                '<button type="button" ' + (isLocked ? 'disabled' : 'onclick="pickTeam(\'' + game.id + '\', \'' + awayCode + '\')"') + ' class="' + baseButtonClasses + awayStyle + ' ' + cursorStyle + '">' +
                '<div class="flex flex-col items-center w-full">' +
                '<img src="' + awayLogo + '" alt="' + awayCode + '" class="w-12 h-12 object-contain mb-2 drop-shadow" onerror="this.onerror=null;this.src=\'https://a.espncdn.com/i/teamlogos/nfl/500/scoreboard/' + awayCode.toLowerCase() + '.png\';">' +
                '<div class="font-bold text-sm tracking-wide flex items-center gap-1.5">' +
                (isAwaySelected ? '<i class="fa-solid fa-check text-amber-400 text-xs"></i> ' : '') +
                awayCode +
                '</div>' +
                (isFinal ? '<div class="text-xl font-extrabold mt-1 text-white">' + (game.awayScore ?? 0) + '</div>' : '') +
                '</div>' +
                renderTeamStatsBlock(awayCode, statsMap) +
                '</button>' +

                // Mandante
                '<button type="button" ' + (isLocked ? 'disabled' : 'onclick="pickTeam(\'' + game.id + '\', \'' + homeCode + '\')"') + ' class="' + baseButtonClasses + homeStyle + ' ' + cursorStyle + '">' +
                '<div class="flex flex-col items-center w-full">' +
                '<img src="' + homeLogo + '" alt="' + homeCode + '" class="w-12 h-12 object-contain mb-2 drop-shadow" onerror="this.onerror=null;this.src=\'https://a.espncdn.com/i/teamlogos/nfl/500/scoreboard/' + homeCode.toLowerCase() + '.png\';">' +
                '<div class="font-bold text-sm tracking-wide flex items-center gap-1.5">' +
                (isHomeSelected ? '<i class="fa-solid fa-check text-amber-400 text-xs"></i> ' : '') +
                homeCode +
                '</div>' +
                (isFinal ? '<div class="text-xl font-extrabold mt-1 text-white">' + (game.homeScore ?? 0) + '</div>' : '') +
                '</div>' +
                renderTeamStatsBlock(homeCode, statsMap) +
                '</button>' +
                '</div>' +
                renderWinProbabilityBar(awayCode, homeCode, statsMap);

            grid.appendChild(card);
        });
    }

    function renderTiebreakerCard(weekData, existingMargin) {
        const card = document.getElementById('tiebreakerCard');
        const desc = document.getElementById('tiebreakerGameDescription');
        const input = document.getElementById('tiebreakerMarginInput');

        if (!weekData || !weekData.games || weekData.games.length === 0) {
            card.classList.add('hidden');
            return;
        }

        let tbGame = null;
        if (weekData.tiebreakerGameId) {
            tbGame = weekData.games.find(g => g.id === weekData.tiebreakerGameId);
        }
        if (!tbGame && weekData.games.length > 0) {
            tbGame = weekData.games[weekData.games.length - 1];
        }

        if (tbGame) {
            desc.textContent = 'Último jogo: ' + tbGame.awayTeam + ' @ ' + tbGame.homeTeam + '. Insira a margem de pontos prevista da vitória.';
        }

        input.value = (existingMargin !== null && existingMargin !== undefined) ? existingMargin : '';
        card.classList.remove('hidden');
    }

    async function pickTeam(gameId, team) {
        const userId = currentUser ? (currentUser.id || currentUser.userId || currentUser._id) : null;
        if (!userId) {
            openLoginModal();
            return;
        }

        userPicks[gameId] = team;
        renderGames(activeWeekData.games || [], currentStatsMap, activeWeekData.tiebreakerGameId);

        await sendPicksToBackend();
    }

    async function saveTiebreakerMargin() {
        const userId = currentUser ? (currentUser.id || currentUser.userId || currentUser._id) : null;
        if (!userId) {
            openLoginModal();
            return;
        }

        const input = document.getElementById('tiebreakerMarginInput');
        const margin = parseInt(input.value);

        if (isNaN(margin) || margin <= 0) {
            alert('Informe uma margem de pontos válida (maior que 0).');
            return;
        }

        await sendPicksToBackend(margin);
    }

    async function sendPicksToBackend(overrideMargin) {
        const userId = currentUser ? (currentUser.id || currentUser.userId || currentUser._id) : null;
        if (!userId) return;

        const marginInput = document.getElementById('tiebreakerMarginInput');
        const margin = (overrideMargin !== undefined) ? overrideMargin : (parseInt(marginInput.value) || null);

        const payload = {
            userId: userId,
            season: CURRENT_SEASON,
            weekNumber: currentWeek,
            picks: userPicks
        };

        if (margin) {
            payload.tiebreakerMargin = margin;
        }

        try {
            const res = await fetch('/api/picks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                showNotification('Salvo com sucesso!', 'success');
            } else {
                const errDetail = await res.text();
                showNotification('Erro ao salvar: ' + errDetail, 'error');
            }
        } catch (e) {
            console.error('Erro de conexão ao salvar:', e);
            showNotification('Erro de conexão ao salvar.', 'error');
        }
    }

    async function openLeaderboardModal() {
        const modal = document.getElementById('leaderboardModal');
        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-500">Calculando pontuações...</td></tr>';
        modal.classList.remove('hidden');

        try {
            const res = await fetch('/api/leaderboard/' + CURRENT_SEASON);
            if (!res.ok) throw new Error('Erro ao carregar leaderboard');
            const ranking = await res.json();

            tbody.innerHTML = '';
            if (!ranking || ranking.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-500">Nenhum palpite computado ainda.</td></tr>';
                return;
            }

            ranking.forEach((u, index) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-800/40 border-b border-slate-800/40';

                const position = u.rank || (index + 1);
                let posBadge = '<span class="font-medium text-slate-400">' + position + 'º</span>';
                if (position === 1) posBadge = '<span class="text-amber-400 font-bold"><i class="fa-solid fa-medal"></i> 1º</span>';
                if (position === 2) posBadge = '<span class="text-slate-300 font-bold"><i class="fa-solid fa-medal"></i> 2º</span>';
                if (position === 3) posBadge = '<span class="text-amber-600 font-bold"><i class="fa-solid fa-medal"></i> 3º</span>';

                const name = u.displayName || u.username || u.name || ('Participante ' + position);
                const points = u.totalPoints ?? 0;
                const tiebreakerDiff = (u.tiebreakerDifference != null) ? u.tiebreakerDifference + ' pts' : '-';

                row.innerHTML = '<td class="px-4 py-3">' + posBadge + '</td>' +
                    '<td class="px-4 py-3 font-semibold text-slate-200">' + name + '</td>' +
                    '<td class="px-4 py-3 text-center text-emerald-400 font-bold">' + points + '</td>' +
                    '<td class="px-4 py-3 text-center text-slate-400">' + tiebreakerDiff + '</td>';
                tbody.appendChild(row);
            });

        } catch (err) {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-red-400">Falha ao carregar ranking.</td></tr>';
        }
    }

    function closeLeaderboardModal() {
        document.getElementById('leaderboardModal').classList.add('hidden');
    }

    function showNotification(msg, type) {
        const banner = document.getElementById('notificationBanner');
        const message = document.getElementById('notificationMessage');
        message.textContent = msg;

        let colorClasses = 'bg-blue-950/80 border border-blue-500 text-blue-300';
        if (type === 'success') {
            colorClasses = 'bg-emerald-950/80 border border-emerald-500 text-emerald-300';
        } else if (type === 'error') {
            colorClasses = 'bg-red-950/80 border border-red-500 text-red-300';
        }

        banner.className = 'mb-6 p-4 rounded-lg text-sm flex items-center justify-between ' + colorClasses;
        banner.classList.remove('hidden');
        setTimeout(() => { hideNotification(); }, 4000);
    }

    function hideNotification() {
        document.getElementById('notificationBanner').classList.add('hidden');
    }
</script>
</body>
</html>
